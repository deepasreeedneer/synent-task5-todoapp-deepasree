<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepaTasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>DeepaTasks</h1>
        <p>Organize your tasks efficiently</p>
    </div>

    <div class="input-section">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >

        <select id="category">
            <option>Study</option>
            <option>Work</option>
            <option>Personal</option>
        </select>

        <button id="addBtn">
            Add Task
        </button>

    </div>

    <div class="task-info">
        Tasks Remaining:
        <span id="taskCount">0</span>
    </div>

    <ul id="taskList">

    </ul>

</div>

<script src="script.js"></script>

</body>
</html>
